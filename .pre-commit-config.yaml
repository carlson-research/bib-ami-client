repos:
  # 1. Standard Git sanity checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. Ruff: Replaces Black, isort, and flake8
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      # Run the Ruff linter and automatically fix safe issues
      - id: ruff
        args: [ --fix ]
      # Run the Ruff formatter (replaces Black)
      - id: ruff-format

  # 3. Mypy: Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        # Provide types for external libraries you use
        additional_dependencies:
          - types-requests
