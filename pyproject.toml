[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib-ami"
dynamic = ["version"]
description = "A command-line tool for improving the integrity of BibTeX bibliographies"
readme = "README.md"
authors = [{name = "Carlson Research, LLC"}]
license = {text = "Business Source License 1.1"}
requires-python = ">=3.8"
dependencies = [
    "bibtexparser>=1.4.1",
    "httpx>=0.27.0",
    "ratelimit>=2.2.1",
    "rapidfuzz>=3.0.0",
    "pydantic>=2.0.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/carlson-research/bib-ami"
Repository = "https://github.com/carlson-research/bib-ami"
Documentation = "https://bib-ami.readthedocs.io"

[project.scripts]
bib-ami = "bib_ami.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "sphinx>=7.0.0",
    "sphinx_rtd_theme>=2.0.0",
    "pre-commit<3.8.0",
]

[tool.coverage.run]
source = ["src/bib_ami"]
omit = [
    "src/bib_ami/__main__.py",
]

[tool.setuptools.dynamic]
version = {attr = "bib_ami._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bib_ami*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = [".", "src"]
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
